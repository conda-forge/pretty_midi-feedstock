{% set name = "pretty_midi" %}
{% set version = "0.2.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pretty_midi-{{ version }}.tar.gz
  sha256: dda81d643f71a0e91843a8644b312c0380237f1e63d5c6188225785c8d58cc67

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=2.7
  run:
    - mido
    - numpy >=1.7.0
    - python >=2.7
    - six

test:
  imports:
    - pretty_midi
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/craffel/pretty-midi
  summary: Functions and classes for handling MIDI data conveniently.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Walter-0
